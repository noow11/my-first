<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <section class="calculator" aria-label="Calculator">
      <header class="calculator-header">
        <div>
          <span class="eyebrow">QUICK MATH</span>
          <h1>Calculator</h1>
        </div>
        <div class="status-dot" aria-label="Calculator ready"></div>
      </header>

      <div class="display" aria-live="polite">
        <div class="previous-display" id="previousDisplay"></div>
        <div class="current-display" id="currentDisplay">0</div>
      </div>

      <div class="keypad">
        <button class="key key-muted" data-action="clear">AC</button>
        <button class="key key-muted" data-action="delete" aria-label="Delete">DEL</button>
        <button class="key key-operator" data-action="operator" data-value="%">%</button>
        <button class="key key-operator" data-action="operator" data-value="÷">÷</button>

        <button class="key" data-number="7">7</button>
        <button class="key" data-number="8">8</button>
        <button class="key" data-number="9">9</button>
        <button class="key key-operator" data-action="operator" data-value="×">×</button>

        <button class="key" data-number="4">4</button>
        <button class="key" data-number="5">5</button>
        <button class="key" data-number="6">6</button>
        <button class="key key-operator" data-action="operator" data-value="−">−</button>

        <button class="key" data-number="1">1</button>
        <button class="key" data-number="2">2</button>
        <button class="key" data-number="3">3</button>
        <button class="key key-operator" data-action="operator" data-value="+">+</button>

        <button class="key key-zero" data-number="0">0</button>
        <button class="key" data-action="decimal">.</button>
        <button class="key key-equals" data-action="equals">=</button>
      </div>
      <p class="hint">Use your keyboard for a faster calculation</p>
    </section>
  </main>
</body>
</html>
